# ═══════════════════════════════════════════════════════════════════════════════
# RadarFondos 360 — Fase 3: Autonomía Institucional
# docker-compose.yml — Orquestación local para desarrollo y staging
#
# Servicios:
#   backend     Node.js monolito (server.js) — puerto 3000
#   frontend    React/Vite (solo dev local)  — puerto 5173
#
# NOTA (Operación Blindaje Final, 2026-08-08 — hallazgo 2 de la radiografía
# 360): el servicio `ai_service` (Python FastAPI + LangGraph) fue retirado de
# aquí y archivado en `archive/ai_service_legacy/`. Verificado que nunca se
# usó en producción: `AI_SERVICE_URL` no tenía ningún caller real en
# `backend/`, el puente Node prometido (`formularProyectoInversion.js`) nunca
# se escribió, y el único despliegue real (`render.yaml`) define un solo
# servicio Node. Las funciones de IA en producción (árbol de objetivos,
# viabilidad, enfoque de entidad, copiloto) usan Gemini directo desde Node,
# no este pipeline. Si se decide revivirlo, es una decisión de infraestructura
# aparte (segundo servicio en Render, costo adicional) — no un simple `docker
# compose up`.
#
# Arranque completo:
#   docker compose up --build
#
# Variables de entorno:
#   Copia .env.example → .env y completa los valores.
#   NUNCA uses SUPABASE_SERVICE_KEY en ningún servicio (RLS con withTenant).
# ═══════════════════════════════════════════════════════════════════════════════

services:

  # ── Node.js Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: radarfondos-backend:latest
    container_name: radarfondos_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV:          production
      PORT:              "3000"

      # ── Supabase (NUNCA incluir SERVICE_KEY — usar RLS + withTenant) ─────────
      SUPABASE_URL:      ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      # SUPABASE_SERVICE_KEY → PROHIBIDO. Ver backend/config/supabase.config.js

      # ── Base de datos directa (pgvector) ─────────────────────────────────────
      DATABASE_URL:      ${DATABASE_URL}

      # ── Bóveda de Credenciales (AES-256-GCM) ─────────────────────────────────
      ENCRYPTION_KEY:    ${ENCRYPTION_KEY}

      # ── Auth ──────────────────────────────────────────────────────────────────
      JWT_SECRET:        ${JWT_SECRET}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}

      # ── Pagos ─────────────────────────────────────────────────────────────────
      STRIPE_SECRET_KEY:        ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET:    ${STRIPE_WEBHOOK_SECRET}

      # ── Email ─────────────────────────────────────────────────────────────────
      RESEND_API_KEY:    ${RESEND_API_KEY}
      APP_URL:           ${APP_URL:-http://localhost:3000}

      # ── Inngest ───────────────────────────────────────────────────────────────
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY}

    networks:
      - radarfondos_net
    volumes:
      # Logs persistentes (opcional — Railway los expone via dashboard)
      - backend_logs:/app/logs

  # ── Frontend React/Vite — solo para desarrollo local ─────────────────────────
  # En producción, Render sirve el build estático con Nginx (Dockerfile.frontend).
  # Para staging en Railway: deshabilitar este servicio y usar el build de Nginx.
  frontend:
    image: node:20-alpine
    container_name: radarfondos_frontend
    profiles: ["dev"]       # solo arranca con: docker compose --profile dev up
    restart: unless-stopped
    ports:
      - "5173:5173"
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules   # anonymous volume para evitar sobreescribir node_modules del host
    environment:
      VITE_API_URL:  ${VITE_API_URL:-http://localhost:3000}
      VITE_SUPABASE_URL:      ${SUPABASE_URL}
      VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    command: npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      - backend
    networks:
      - radarfondos_net

# ── Red interna ───────────────────────────────────────────────────────────────
# Los servicios se comunican por nombre de servicio (backend, frontend).
# Ningún secreto viaja fuera de esta red salvo por los puertos expuestos.
networks:
  radarfondos_net:
    driver: bridge

# ── Volúmenes ─────────────────────────────────────────────────────────────────
volumes:
  backend_logs:
    driver: local
