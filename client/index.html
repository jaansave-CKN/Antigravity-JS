<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <!-- Cache-busting: el navegador nunca guarda este HTML en caché.
       Los assets JS/CSS sí se cachean (sus nombres cambian con el hash). -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#001c2e" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="GGIE - Global Grant Intelligence Engine | Radar de Fondos y Subvenciones inteligente para Colombia" />
  <title>GGIE - Radar de Fondos | Antigravity OS</title>

  <!-- Open Graph / Twitter Card — previsualización al compartir enlaces -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="RadarFondos 360" />
  <meta property="og:title" content="GGIE - Radar de Fondos | Antigravity OS" />
  <meta property="og:description"
    content="Global Grant Intelligence Engine — Radar de Fondos y Subvenciones inteligente para Colombia" />
  <meta property="og:image" content="/favicon.svg" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="GGIE - Radar de Fondos | Antigravity OS" />
  <meta name="twitter:description"
    content="Global Grant Intelligence Engine — Radar de Fondos y Subvenciones inteligente para Colombia" />
  <meta name="twitter:image" content="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <!-- Tailwind: migrado del CDN a build local vía PostCSS el 2026-08-03 —
       config exacto de Stitch ahora vive en client/tailwind.config.cjs -->
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <!-- FIX (2026-08-24, auditoría "salto visual" del botón SAVE entre ventanas):
       Public Sans se cargaba SOLO vía @import dentro de cada .css de página
       (EntradaPage.css, ContextoPage.css, etc.) — PresupuestoPage.tsx y
       MatrizRaciPage.tsx no tienen .css propio (todo inline) y usaban
       'Manrope', que nunca se cargó en ningún lado — caía al sans-serif
       genérico del sistema, con métricas de altura de línea distintas a
       Public Sans. Cargarla aquí, global, la deja disponible para TODA la
       app sin depender de qué .css se haya importado. -->
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
  <!-- ERROR CATCHER: muestra errores JS en pantalla antes de que React monte -->
  <script>
    window.__errors = [];
    window.onerror = function(msg, src, line, col, err) {
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#b91c1c;color:#fff;padding:16px;font:13px monospace;z-index:99999;white-space:pre-wrap;word-break:break-all';
      d.textContent = 'JS ERROR: ' + msg + '\nArchivo: ' + src + ':' + line + ':' + col;
      document.body ? document.body.appendChild(d) : document.addEventListener('DOMContentLoaded', function(){ document.body.appendChild(d); });
      window.__errors.push(msg);
    };
    window.addEventListener('unhandledrejection', function(e) {
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;top:60px;left:0;right:0;background:#92400e;color:#fff;padding:16px;font:13px monospace;z-index:99999;white-space:pre-wrap;word-break:break-all';
      d.textContent = 'PROMISE REJECT: ' + (e.reason?.message || e.reason || e);
      document.body ? document.body.appendChild(d) : document.addEventListener('DOMContentLoaded', function(){ document.body.appendChild(d); });
    });
  </script>
  <style>
    html, body { min-height: 100vh; width: 100%; margin: 0; padding: 0; }
    #root { min-height: 100vh; }
    .leaflet-container { height: 100%; width: 100%; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .material-symbols-outlined.fill { font-variation-settings: 'FILL' 1; }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
