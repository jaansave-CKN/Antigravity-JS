<!DOCTYPE html><html class="light" lang="es" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#0041a3", // Corporate blue from edit request
                        "on-primary": "#ffffff",
                        "primary-container": "#dce1ff",
                        "on-primary-container": "#001551",
                        "secondary": "#455b9d",
                        "on-secondary": "#ffffff",
                        "surface-container-highest": "#e0e3e5",
                        "outline": "#747686",
                        "surface-container-high": "#e6e8ea",
                        "surface-container-low": "#f2f4f6",
                        "on-surface": "#191c1e",
                        "surface-variant": "#e0e3e5",
                        "surface-tint": "#2151da",
                        "outline-variant": "#c4c5d7",
                        "background": "#f7f9fb",
                        "surface-bright": "#f7f9fb",
                        "on-surface-variant": "#434655",
                        "error": "#ba1a1a",
                        "error-container": "#ffdad6",
                        "on-error": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "surface-container": "#eceef0",
                        "surface": "#f7f9fb"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "body": ["Public Sans", "sans-serif"],
                        "headline": ["Public Sans", "sans-serif"],
                        "label": ["Public Sans", "sans-serif"]
                    },
                    "fontSize": {
                        "label-sm": ["11px", { "lineHeight": "16px", "fontWeight": "700" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Public Sans', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-surface-container-lowest font-body text-on-surface m-0 p-0 antialiased">
<!-- Main Content Area -->
<main class="w-full min-h-screen bg-surface-container-lowest">
<!-- Formulation Container -->
<div class="bg-surface-container-lowest overflow-hidden">
<div class="overflow-x-auto">
<table class="w-full text-left border-collapse">
<tbody class="divide-y divide-outline-variant">
<!-- Row Template -->
<tr class="hover:bg-primary/5 transition-colors group">
<td class="px-6 py-6" style="width: 70%;">
<div class="flex flex-col gap-1.5">
<label class="text-label-sm font-bold text-on-surface-variant uppercase tracking-wider">DESCRIPCION</label>
<input class="w-full border border-outline-variant rounded-lg px-4 py-2.5 bg-surface-container-lowest focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-body-md text-on-surface placeholder:text-outline-variant" placeholder="Descripcion del soporte" type="text">
</div>
</td>
<td class="px-2 py-6" style="width: 10%;">
<div class="flex flex-col gap-1.5 items-center">
<label class="text-label-sm font-bold text-on-surface-variant uppercase tracking-wider">TEXTO</label>
<input class="w-full border border-outline-variant rounded-lg px-3 py-2.5 bg-surface-container-lowest focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-body-md text-on-surface text-center placeholder:text-outline-variant" placeholder="TEXTO" type="text">
</div>
</td>
<td class="px-2 py-6" style="width: 10%;">
<div class="flex flex-col gap-1.5 items-center">
<label class="text-label-sm font-bold text-on-surface-variant uppercase tracking-wider">ANEXO.</label>
<div class="relative flex items-center w-full">
<input class="w-full border border-outline-variant rounded-lg pl-3 pr-9 py-2.5 bg-surface-container-lowest focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-body-md text-on-surface placeholder:text-outline-variant" placeholder="." type="text">
<div class="absolute right-3 flex items-center text-outline group-hover:text-primary transition-colors cursor-pointer" title="Ver anexo">
<span class="material-symbols-outlined text-[20px]">attach_file</span>
</div>
</div>
</div>
</td>
<td class="px-2 py-6" style="width: 10%;">
<div class="flex flex-col gap-1.5 items-center">
<label class="text-label-sm font-bold text-on-surface-variant uppercase tracking-wider">LINK</label>
<input class="w-full border border-outline-variant rounded-lg px-3 py-2.5 bg-surface-container-lowest focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-body-md text-on-surface text-center placeholder:text-outline-variant" placeholder="WWW" type="text">
</div>
</td>
<td class="px-6 py-6 text-center" style="width: 48px;">
<div class="flex flex-col gap-1.5 items-center">
<span class="h-[16px]"></span>
<button class="hover:bg-primary/10 p-2.5 rounded-full transition-all active:scale-90 text-error" title="Eliminar soporte">
<span class="material-symbols-outlined font-bold">delete</span>
</button>
</div>
</td>
</tr>
</tbody>
</table>
</div>
<!-- Footer Action -->
<div class="px-6 py-5 bg-surface-container-lowest border-t border-outline-variant">
<button class="flex items-center gap-2.5 text-primary font-bold text-sm hover:underline active:scale-95 transition-transform group">
<span class="material-symbols-outlined text-[24px] group-hover:scale-110 transition-transform">add_circle</span>
                    Agregar nuevo soporte documental
                </button>
</div>
</div>
</main>


</body></html>
