name: Gate de Arquitectura

# Mueve el enforcement de "confío en que corriste el hook local" a "GitHub
# lo exige antes de aceptar el push/PR" — el hook de pre-commit (aunque ya
# está versionado, ver scripts/pre-commit.sh) solo protege a quien lo tiene
# instalado en su máquina. Un clone fresco sin `npm install`, o un commit
# con `--no-verify`, no pasa por ese hook en absoluto. Este workflow es la
# segunda línea de defensa: corre en el servidor, sin excepción posible
# desde la máquina de nadie.
#
# NOTA: esto NO reemplaza --check-gate/--aprobar-diseno (esos siguen siendo
# la fuente de verdad de "el diseño fue aprobado"). Este workflow valida
# que el estado del repo sea internamente consistente (tests pasan, gate
# no está roto) — no invoca la API de Anthropic, cero costo por push.

on:
  push:
    # NUNCA "main": ese branch en este repositorio remoto es el default
    # branch de OTRO proyecto real del usuario (RadarFondos 360, sin
    # ancestro común con master — ver docs/ARQUITECTURA_AGENTICA_ANTIGRAVITY.md
    # §0-D/§0-W2). Correr el gate de Antigravity JS contra pushes a "main"
    # no tenía sentido: es otro código. Corregido 2026-08-13 (Fase 1 del
    # blindaje de topología de ramas): se quita "main", se agrega
    # "radfor360-production" — la rama que Render despliega de verdad, que
    # hasta ahora NO tenía cobertura de CI en absoluto pese a ser producción.
    branches: [master, radfor360-production]
  pull_request:
    branches: [master, radfor360-production]

jobs:
  gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 20 -> 22 (2026-08-13): file-type@22.0.1 (dependencia transitiva
          # de @sentry/node) exige Node >=22 (EBADENGINE con Node 20) — ver
          # también "engines" en package.json. Necesario pero NO fue
          # suficiente por sí solo para arreglar la CI real (ver nota abajo).
          node-version: '22'

      - name: Instalar dependencias
        # `npm ci` (no `npm install`) fue la causa real de 5 ejecuciones
        # fallidas seguidas (2026-08-13, verificado vía API de GitHub
        # Actions, no supuesto): "Missing: @types/react@19.2.18 from lock
        # file" — persistía incluso con Node 22, y `npm ci` LOCAL (misma
        # máquina, mismo lockfile) sí funcionaba, así que no era un problema
        # del lockfile en sí — es una divergencia de validación entre la
        # versión de npm local (v11, más permisiva) y la que trae el runner
        # de GitHub. `npm install` es menos estricto sobre sincronía exacta
        # del lockfile y es lo que YA usa render.yaml en producción
        # (buildCommand: "npm install && ...") — alinear la CI con lo que
        # ya funciona en producción, no un capricho de conveniencia.
        run: npm install --ignore-scripts
        # --ignore-scripts: evita correr `prepare` (instala el hook de git,
        # irrelevante en un runner efímero) y cualquier postinstall que
        # dependa de un entorno interactivo.

      - name: Tests del gate de arquitectura
        run: npm run test:gate

      - name: Veto de 008_AUDITOR_DE_CODIGO — tenant_id / idempotencia / COP (BLOQUEANTE)
        run: node scripts/check_veto_008.cjs --base ${{ github.event.pull_request.base.sha || github.event.before }}
        # SIN continue-on-error, a propósito (orden explícita 2026-08-13,
        # "Fase 2 — Guillotina CI/CD"): esto SÍ debe abortar el pipeline.
        # Chequeos deterministas sobre el diff del push/PR (nunca sobre todo
        # el árbol — evita bloquear por archivos históricos ya deployados
        # que nadie está tocando): fuga de aislamiento multi-tenant (RPC con
        # p_tenant_id obligatorio sin filtro), ausencia de idempotencia/OCC
        # en funciones que hacen INSERT, y la cadena "USD" en cualquier
        # archivo .sql/.js tocado. Ver scripts/check_veto_008.cjs para el
        # detalle y las exenciones documentadas (funciones registrar_*,
        # set_tenant_context).

      - name: 008_AUDITOR_DE_CODIGO — PROTOCOLO TITAN completo (ADVISORY, no bloqueante)
        run: node scripts/auditor_008_advisory_gate.cjs --base ${{ github.event.pull_request.base.sha || github.event.before }}
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Integra el juicio real de un LLM aplicando el protocolo TITAN completo
        # de 008 (Capas 0-9, red team narrativo) contra el diff real del push/PR —
        # hasta 2026-08-13 solo se invocaba a mano. Condición NO NEGOCIABLE impuesta
        # por 002_ARQUITECTO_DE_SOFTWARE (veredicto + orden explícita del usuario):
        # este paso jamás puede bloquear el pipeline sin su aprobación explícita —
        # por eso continue-on-error: true Y el script mismo siempre sale con exit 0
        # (doble cinturón). El veto DETERMINISTA de arriba (check_veto_008.cjs) sigue
        # siendo el único que bloquea de verdad. Si falta el secret ANTHROPIC_API_KEY
        # en este repo, el paso simplemente reporta omitido y sigue sin efecto —
        # ver scripts/auditor_008_advisory_gate.cjs para el detalle. El resultado
        # (veredicto apto/no apto, score, hallazgos críticos, análisis narrativo
        # completo) queda visible en el log de este step y en el Step Summary de
        # GitHub Actions para revisión humana.

      - name: Verificar que el gate esté en estado consistente (--check-gate)
        run: node agents/architecture-gate.cjs --check-gate
        continue-on-error: true
        # continue-on-error: el gate compara contra una firma que vive en
        # agents/diseno_aprobado.json, committeada — puede legítimamente
        # estar "sin aprobación vigente" si el PR mismo es lo que se está
        # evaluando. No bloquea el CI por sí solo; los tests (paso anterior)
        # sí son bloqueantes de verdad.

      - name: npm audit (informativo — no bloquea el build todavía)
        run: npm audit --audit-level=critical
        continue-on-error: true
        # Ver docs/ARQUITECTURA_AGENTICA_ANTIGRAVITY.md §0-R: 4 críticas y
        # 20 altas detectadas 2026-08-12, sin corregir. Cuando se resuelvan,
        # quitar continue-on-error para que esto sí bloquee el merge.
