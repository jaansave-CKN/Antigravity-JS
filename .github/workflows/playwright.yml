name: Playwright E2E

# LOTE 4 (2026-09-24, "opción B" del dueño): la suite E2E corre contra un
# Supabase COMPLETO dentro del runner (Supabase CLI: Postgres 17 + roles
# anon/authenticated/service_role + Storage reales), NO contra producción.
# De producción solo se lee la ESTRUCTURA del esquema public (sin datos),
# así la réplica nunca se desincroniza de las migraciones aplicadas.
# Antes: la suite registraba usuarios, subía archivos al bucket y escribía
# filas en la BD de producción (limpiadas por global-teardown, pero con
# riesgo de residuo si una corrida moría a mitad).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Un solo run por rama a la vez (2026-10-12). `test` es un check OBLIGATORIO de
# la protección de main, así que un fallo suyo bloquea la fusión aunque el
# código esté bien — y eso ya pasó: un run falló con
#   failed to bind host port 0.0.0.0:54322 → address already in use
# al levantar el Supabase local del runner. Sin este grupo, dos pushes
# seguidos a la misma rama dejaban dos runs compitiendo por los puertos fijos
# del stack de Supabase (54321-54324). El run viejo se cancela: lo que importa
# es el veredicto sobre el commit más reciente.
concurrency:
  group: playwright-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, no 20: undici 8.x (dependencia directa) exige Node >= 22.19; con 20 el
          # backend no arrancaba (webidl.util.markAsUncloneable is not a function).
          node-version: 22
          cache: npm

      - name: Verificar secretos requeridos (sin imprimir valores)
        env:
          S_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # DATABASE_URL de producción se usa SOLO para leer la estructura del
          # esquema (pg_dump --schema-only). JWT_SECRET/ENCRYPTION_KEY de CI se
          # generan aleatorios en cada corrida (no se reutilizan de producción).
          if [ -z "$S_DATABASE_URL" ]; then
            echo "::error::Falta el secreto DATABASE_URL (solo se usa para leer el esquema)"; exit 1
          fi
          echo "Secreto presente (valor enmascarado por GitHub)."

      - name: Instalar dependencias
        run: npm ci

      # LOTE 10 (2026-09-25): hasta aquí NINGÚN workflow ejecutaba las pruebas
      # unitarias — las guardias de Lotes 8/9 (tokens y razonamiento acotado,
      # reintento obligatorio ante 503) solo corrían en local. Van en este job
      # porque "test" es el check obligatorio de main: si fallan, no se fusiona.
      - name: Pruebas unitarias (incluye guardias de IA)
        run: npm run test:unit

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # ── Supabase local: Postgres 17 (misma versión mayor que producción,
      # verificado: server_version 17.6) + Storage + API gateway.
      - name: Levantar Supabase local (Postgres 17 + Storage)
        # Reintento con limpieza previa (2026-10-12). Un run falló con
        #   failed to bind host port 0.0.0.0:54322 → address already in use
        # verificado SIN runs concurrentes: un contenedor huérfano del stack
        # seguía ocupando el puerto. `supabase start` no limpia por su cuenta,
        # así que un arranque sucio tumbaba un check OBLIGATORIO con el código
        # intacto. Ahora se limpia antes, y si el arranque falla igual se
        # derriba todo y se reintenta una vez.
        run: |
          set -uo pipefail
          supabase init --force
          sed -i 's/^major_version = .*/major_version = 17/' supabase/config.toml

          EXCLUIDOS="studio,mailpit,inbucket,edge-runtime,logflare,vector,realtime,supavisor,postgres-meta"

          limpiar() {
            echo "Limpiando restos del stack de Supabase…"
            supabase stop --no-backup >/dev/null 2>&1 || true
            # Red de seguridad: contenedores del stack que `supabase stop` no
            # alcance (nombre supabase_*_<repo>) quedarían con el puerto tomado.
            docker ps -aq --filter "name=supabase_" | xargs -r docker rm -f >/dev/null 2>&1 || true
          }

          limpiar
          if ! supabase start -x "$EXCLUIDOS"; then
            echo "::warning::El primer arranque de Supabase falló — se limpia y se reintenta una vez."
            limpiar
            sleep 10
            supabase start -x "$EXCLUIDOS"
          fi

          supabase status -o env | grep -E '^(API_URL|DB_URL|ANON_KEY|SERVICE_ROLE_KEY)=' > supabase.env
          for k in API_URL DB_URL ANON_KEY SERVICE_ROLE_KEY; do grep -q "^$k=" supabase.env || { echo "::error::supabase status no expuso $k"; exit 1; }; done

      # ── Estructura de producción (sin datos) → réplica local.
      # Pooler en modo SESIÓN (5432): pg_dump no es compatible con el modo
      # transacción (6543) de Supavisor.
      - name: Replicar el esquema public de producción (solo estructura)
        env:
          S_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          SESION_URL="${S_DATABASE_URL/:6543\//:5432/}"
          supabase db dump --db-url "$SESION_URL" --schema public -f public_schema.sql
          echo "Esquema volcado: $(grep -c '^CREATE TABLE' public_schema.sql) tablas"
          set -a; . ./supabase.env; set +a
          # Rol RLS-escopado de producción (053): el volcado le otorga permisos.
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE rf360_rls_scoped LOGIN PASSWORD 'ci_rls_scoped' NOINHERIT;"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS vector WITH SCHEMA public; CREATE EXTENSION IF NOT EXISTS unaccent WITH SCHEMA public;"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f public_schema.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "GRANT USAGE ON SCHEMA public TO rf360_rls_scoped;"
          psql "$DB_URL" -At -c "SELECT 'tablas replicadas: ' || count(*) FROM pg_tables WHERE schemaname = 'public';"

      - name: Generar .env para CI (todo apunta al Supabase local)
        run: |
          set -a; . ./supabase.env; set +a
          SCOPED_URL="$(echo "$DB_URL" | sed -E 's#//[^:]+:[^@]+@#//rf360_rls_scoped:ci_rls_scoped@#')"
          {
            echo "DATABASE_URL=$DB_URL"
            echo "DATABASE_URL_TENANT_SCOPED=$SCOPED_URL"
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_KEY=$SERVICE_ROLE_KEY"
            echo "SUPABASE_STORAGE_KEY=$SERVICE_ROLE_KEY"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "ENCRYPTION_KEY=$(openssl rand -hex 32)"
            echo "NODE_ENV=test"
            # La suite completa supera las 100 peticiones/IP de slowDown
            # (SecurityMiddleware.js) y cada petición extra sumaba hasta 10 s.
            # Exención solo de CI; en producción no aplica aunque se ponga.
            # La misma bandera sube el limitador global /api de 300 a 1000
            # (topeLimiteGlobalApi): la suite ya consumía 227 de 300.
            echo "E2E_DESACTIVAR_SLOWDOWN=1"
            # server.js usa PORT || 3000; playwright.config.ts espera el
            # backend en 127.0.0.1:8000 (igual que el proxy de vite.config.ts).
            echo "PORT=8000"
          } > .env
          # client/.env (gitignored): el frontend exige VITE_API_URL
          # (client/src/utils/envValidator.ts lanza sin ella y la app no
          # arranca en ninguna página). Mismo origen que baseURL de
          # playwright.config.ts; si difiere, la CSP bloquea las llamadas.
          echo "VITE_API_URL=http://localhost:5173" > client/.env

      - name: Ejecutar suite E2E (levanta backend+frontend vía webServer de Playwright)
        run: npm run test:e2e
        env:
          CI: true
          # Vite dev (webServer) salta el control de planes en desarrollo; esta
          # bandera lo fuerza en el CI para que tests/e2e/planes-bloqueo.spec.ts
          # ejerza PlanGate de verdad (client/src/lib/planes.ts). El spec falla
          # si en CI la bandera no está activa.
          VITE_TEST_PLAN_ENFORCEMENT: 'true'

      - name: Comprobar que la suite no dejó residuos en la réplica
        if: always()
        run: |
          # Guarda del archivo (2026-10-12): con `if: always()` este paso corre
          # incluso cuando Supabase no llegó a levantar, y entonces fallaba con
          #   ./supabase.env: No such file or directory
          # Ese error aparecía como el ÚLTIMO del log y tapaba la causa real
          # (el puerto ocupado, varios pasos más arriba): se diagnosticaba el
          # síntoma equivocado. Si no hay réplica, no hay residuo que medir.
          if [ ! -f ./supabase.env ]; then
            echo "::notice::Supabase local no llegó a levantar — no hay réplica que auditar. La causa real está en el paso que falló antes."
            exit 0
          fi
          set -a; . ./supabase.env; set +a
          # Falla (antes terminaba con "|| true") si queda algún usuario E2E.
          restantes=$(psql "$DB_URL" -At -c "SELECT count(*) FROM usuarios WHERE email LIKE 'e2e%@example.com';")
          echo "usuarios e2e restantes: $restantes"
          test "$restantes" = "0"

      - name: Derribar el stack de Supabase local
        if: always()
        # Deja el runner limpio aunque la suite falle: un contenedor huérfano
        # con el puerto 54322 tomado es la causa del flake que este commit
        # corrige. Nunca debe hacer fallar el job.
        run: supabase stop --no-backup || true

      - name: Subir reporte de Playwright (si falló)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
