name: Playwright E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, no 20: undici 8.x (dependencia directa) exige Node >= 22.19; con 20 el
          # backend no arrancaba (webidl.util.markAsUncloneable is not a function).
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium

      # server.js requiere un archivo .env real en disco — npm run dev:backend
      # usa `node --env-file=.env`, que falla con ENOENT si el archivo no
      # existe (no basta con variables ya exportadas al shell). Solo las
      # obligatorias para que arranque el backend y funcione login/registro
      # (DATABASE_URL, JWT_SECRET); todo lo demás (Stripe, Wompi, Sentry,
      # PostHog, Resend, Gemini) se queda en modo STANDBY sin bloquear nada,
      # igual que en local — ver docs/ARQUITECTURA_RADFOR360_2026-08-08.md §8-9.
      # Los secretos entran como variables de entorno del paso (no interpolados
      # en el texto del script) y GitHub los enmascara en cualquier salida. Si
      # falta alguno, se falla aquí con un mensaje claro — antes el backend
      # moría con "FATAL: JWT_SECRET not set" y el error parecía de la app.
      - name: Verificar secretos requeridos (sin imprimir valores)
        env:
          S_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          S_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          S_ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          faltan=""
          [ -z "$S_DATABASE_URL" ]   && faltan="$faltan DATABASE_URL"
          [ -z "$S_JWT_SECRET" ]     && faltan="$faltan JWT_SECRET"
          [ -z "$S_ENCRYPTION_KEY" ] && faltan="$faltan ENCRYPTION_KEY"
          if [ -n "$faltan" ]; then
            echo "::error::Faltan secretos en GitHub (Settings > Secrets and variables > Actions):$faltan"
            exit 1
          fi
          echo "Secretos requeridos presentes (valores enmascarados por GitHub)."

      - name: Generar .env para CI
        env:
          S_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          S_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          S_ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          S_SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Storage (subida de anexos, spec formulador-financiero): sin estos 3
          # el endpoint responde 503 "Almacenamiento de archivos no disponible".
          # global-teardown.ts borra del bucket los archivos que suba la suite.
          S_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          S_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          S_SUPABASE_STORAGE_KEY: ${{ secrets.SUPABASE_STORAGE_KEY }}
        run: |
          {
            echo "DATABASE_URL=$S_DATABASE_URL"
            echo "JWT_SECRET=$S_JWT_SECRET"
            echo "ENCRYPTION_KEY=$S_ENCRYPTION_KEY"
            echo "SUPABASE_SERVICE_KEY=$S_SUPABASE_SERVICE_KEY"
            echo "SUPABASE_URL=$S_SUPABASE_URL"
            echo "SUPABASE_ANON_KEY=$S_SUPABASE_ANON_KEY"
            echo "SUPABASE_STORAGE_KEY=$S_SUPABASE_STORAGE_KEY"
            echo "NODE_ENV=test"
            # server.js usa PORT || 3000; playwright.config.ts espera el
            # backend en 127.0.0.1:8000 (igual que el proxy de vite.config.ts).
            # Sin esta línea el backend arrancaba en 3000 y el webServer
            # moría por timeout de 60s (verificado en el run 35950828108).
            echo "PORT=8000"
          } > .env
          # client/.env (gitignored): el frontend exige VITE_API_URL
          # (client/src/utils/envValidator.ts lanza sin ella y la app no
          # arranca en ninguna página). Mismo origen que baseURL de
          # playwright.config.ts; si difiere, la CSP bloquea las llamadas.
          echo "VITE_API_URL=http://localhost:5173" > client/.env

      - name: Ejecutar suite E2E (levanta backend+frontend vía webServer de Playwright)
        run: npm run test:e2e
        env:
          CI: true

      - name: Subir reporte de Playwright (si falló)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
