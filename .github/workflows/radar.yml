name: Radar Fondos 360 — CI/CD Pipeline V9.0

on:
  # Lote 5 T3 (2026-09-24): el schedule y el job de backup se movieron a
  # backup-s3.yml (aquí workflow_dispatch también despliega a producción).
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/*'
      - 'client/**'
      - 'backend/**'
      - 'server.js'
      - 'render.yaml'
      - 'package.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
  # Protocolo Omega (2026-10-12): el job `ci` también corre en los PULL
  # REQUESTS hacia main. Hasta aquí radar.yml solo se disparaba con el push a
  # main, así que `npm run test:unit` —y con él las guardas de
  # tests/unit/invariantesLanzamiento.test.mjs— corrían DESPUÉS del merge,
  # cuando ya era tarde para bloquear nada. Un gate que solo mira el código ya
  # fusionado no es un gate.
  #
  # El job `deploy` NO se activa aquí: su `if` exige push o workflow_dispatch,
  # así que un PR valida pero nunca despliega.
  #
  # NOTA para el dueño: para que este check BLOQUEE el merge hay que agregar
  # el contexto `ci` a la protección de rama de main (hoy solo exige `test` y
  # `react-doctor`). Eso es un ajuste de seguridad de la cuenta y no se toca
  # sin autorización explícita.
  pull_request:
    branches:
      - main

jobs:
  # ── CI: Validación TypeScript + Build (bloqueante) ────────────────────────────
  ci-gate:
    name: ci-gate — TypeScript + Pruebas + Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'  # undici 8.x exige Node >= 22.19 (ver playwright.yml)
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      # H9 (dictamen pre-lanzamiento 2026-09-30): hasta aquí el gate de deploy
      # era solo tsc + build — un cambio que compilaba pero rompía el cobro, el
      # gating de plan o el guardado llegaba a producción sin fricción, aunque
      # las 300+ pruebas unitarias lo detectaran. Ahora son bloqueantes: el job
      # `deploy` tiene `needs: ci-gate`, así que si esto falla, nada se despliega.
      - name: Pruebas unitarias (bloqueante)
        run: npm run test:unit

      - name: Build frontend
        run: npm run build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Verificar artefactos
        run: |
          echo "✓ Build completado"
          ls -lh dist/
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Fecha: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- Artefactos: $(ls dist/ | wc -l) archivos" >> $GITHUB_STEP_SUMMARY

  # ── CD: Deploy a Render (único destino real — Firebase no existe en esta arquitectura) ──
  deploy:
    name: CD — Deploy a Render
    needs: ci-gate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Trigger Render deploy
        # API oficial de Render (autenticada), no un Deploy Hook. El servicio
        # debe tener autoDeploy=no (render.yaml) para que este paso, gateado
        # por needs:ci-gate, sea el ÚNICO disparador: nada llega a producción sin
        # que tsc/build pasen.
        run: |
          HTTP_CODE=$(curl -s -o /tmp/render_response.json -w "%{http_code}" -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json")
          echo "HTTP status: $HTTP_CODE"
          echo "Respuesta de Render:"
          cat /tmp/render_response.json
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Render API respondió HTTP $HTTP_CODE — revisa RENDER_SERVICE_ID/RENDER_API_KEY en Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Render deploy triggered: $(date)"
          echo "## Deploy V9.0" >> $GITHUB_STEP_SUMMARY
          echo "- Render: deploy disparado (HTTP $HTTP_CODE)" >> $GITHUB_STEP_SUMMARY
          echo "- Fecha: $(date)" >> $GITHUB_STEP_SUMMARY

      - name: Esperar a que ESE deploy quede live y verificar su commit
        # Antes el smoke test arrancaba apenas se DISPARABA el deploy: Render
        # tarda minutos en construir y mientras tanto sigue sirviendo la
        # versión anterior, así que se probaba código viejo. Además, entre el
        # 2026-08-16 y el 2026-09-23 el servicio construía otra rama
        # (radfor360-production, snapshot de la app padre): el CI "desplegaba"
        # con HTTP 2xx pero producción nunca recibió main. Este paso espera el
        # estado final del deploy y exige que el commit desplegado sea el del push.
        # FIX 2026-09-23: se busca el deploy POR COMMIT en la lista de Render,
        # no por el id de la respuesta del POST — con otro deploy en curso,
        # Render responde 202 con cuerpo VACÍO (lo encola) y el paso abortaba
        # con "Render no devolvió id de deploy" (run 35928808277).
        run: |
          for i in $(seq 1 90); do
            curl -s "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys?limit=20" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" -H "Accept: application/json" > /tmp/deploys.json
            STATUS=$(jq -r --arg s "$GITHUB_SHA" '[.[] | .deploy | select(.commit.id == $s)][0].status // "no_encontrado"' /tmp/deploys.json)
            echo "Intento $i: deploy de $GITHUB_SHA -> $STATUS"
            case "$STATUS" in
              live) break ;;
              deactivated)
                # Estuvo live y un deploy más nuevo lo reemplazó (push posterior) —
                # no es un fallo de este commit; ese run hará su propio smoke test.
                echo "::warning::El deploy de $GITHUB_SHA ya fue reemplazado por uno más nuevo"; STATUS=live; break ;;
              build_failed|update_failed|canceled|pre_deploy_failed)
                echo "::error::El deploy del commit $GITHUB_SHA terminó en estado $STATUS (ver logs en el Dashboard de Render)"; exit 1 ;;
              no_encontrado)
                if [ "$i" -ge 30 ]; then
                  echo "::error::Render no tiene ningún deploy del commit $GITHUB_SHA tras 5 min — el servicio está construyendo otra rama. Debe ser 'main' (ver docs/DESPLIEGUE_RENDER.md)."
                  exit 1
                fi ;;
            esac
            sleep 10
          done
          if [ "$STATUS" != "live" ]; then echo "::error::El deploy de $GITHUB_SHA no quedó live en 15 minutos (último estado: $STATUS)"; exit 1; fi
          echo "- Render: deploy live con commit $GITHUB_SHA" >> $GITHUB_STEP_SUMMARY

  # ── Post-Deploy: Smoke Test contra el backend real ya desplegado (bloqueante) ──
  smoke-test:
    name: Smoke Test — post-deploy
    needs: deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'  # undici 8.x exige Node >= 22.19 (ver playwright.yml)
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Esperar a que el deploy de Render esté activo
        # Poll real en vez de sleep fijo: el arranque en frío corre seedPredios/
        # seedDirectorio vía REST de Supabase (Capa 2) ANTES de app.listen(),
        # más lento que un sleep 45 fijo — confirmado con evidencia real: los
        # primeros 3 checks del smoke test agotaban el timeout de 15s cada uno
        # (server aún no aceptaba conexiones) mientras los checks 4-6, ya con
        # el server arriba, respondían en <1s.
        run: |
          for i in $(seq 1 24); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "${{ secrets.SMOKE_TEST_URL }}/api/health" || echo "000")
            echo "Intento $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then echo "Servidor activo."; exit 0; fi
            sleep 5
          done
          echo "::warning::/api/health no respondió 200 tras 120s de polling — se ejecuta el smoke test de todas formas."

      - name: Resolver SMOKE_TEST_TOKEN — fuente única de verdad en Render
        # CAUSA RAÍZ eliminada aquí (2026-10-12). El diseño anterior exigía que
        # el MISMO secreto existiera en DOS sistemas a la vez: en el entorno de
        # Render (de donde lo lee server.js:~1684) y como secreto de GitHub
        # Actions (de donde lo leía este job). Nada mantenía esas dos copias
        # sincronizadas, nada detectaba la desincronización, y el único síntoma
        # era un smoke test rojo después de desplegar. Eso costó dos ciclos de
        # pipeline y una declaración de "estado nominal" que no se pudo emitir.
        #
        # Ahora hay UNA sola fuente: Render, que es donde el servidor realmente
        # lo lee. El CI lo resuelve en tiempo de ejecución con RENDER_API_KEY,
        # que ya existía como secreto para disparar el deploy. No queda ninguna
        # copia que mantener a mano, así que la clase entera de fallo
        # "secreto no registrado / desincronizado" desaparece.
        #
        # Se conserva el secreto de Actions como PRIMERA opción: si alguien lo
        # registra a mano, manda ese — así este cambio no rompe nada existente.
        env:
          TOKEN_MANUAL: ${{ secrets.SMOKE_TEST_TOKEN }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail

          if [ -n "${TOKEN_MANUAL:-}" ]; then
            echo "::add-mask::$TOKEN_MANUAL"
            echo "SMOKE_TEST_TOKEN=$TOKEN_MANUAL" >> "$GITHUB_ENV"
            echo "Origen del token: secreto de GitHub Actions."
            exit 0
          fi

          if [ -z "${RENDER_API_KEY:-}" ] || [ -z "${RENDER_SERVICE_ID:-}" ]; then
            echo "::error::No hay SMOKE_TEST_TOKEN en Actions ni credenciales de Render para resolverlo (faltan RENDER_API_KEY/RENDER_SERVICE_ID)."
            exit 1
          fi

          api() {
            # $1 = ruta. Imprime el cuerpo; devuelve 1 si el HTTP no es 2xx.
            local cuerpo code
            cuerpo=$(mktemp)
            code=$(curl -s -o "$cuerpo" -w "%{http_code}" --max-time 30 \
              "https://api.render.com/v1$1" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" -H "Accept: application/json")
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              echo "::warning::GET /v1$1 → HTTP $code" >&2
              rm -f "$cuerpo"; return 1
            fi
            cat "$cuerpo"; rm -f "$cuerpo"
          }

          # Render expone las variables en DOS lugares y este endpoint solo ve
          # el primero: las del propio servicio. Si la variable vive en un
          # GRUPO de entorno compartido, no aparece aquí — causa real del fallo
          # del run 38316218203, diagnosticada con la lista de claves de abajo.
          echo "Resolviendo el token desde el entorno de Render (fuente única)…"
          TOKEN=""

          if SERV=$(api "/services/${RENDER_SERVICE_ID}/env-vars?limit=100"); then
            TOKEN=$(printf '%s' "$SERV" | jq -r '[.[] | .envVar | select(.key == "SMOKE_TEST_TOKEN") | .value][0] // ""')
            if [ -z "$TOKEN" ]; then
              # Solo NOMBRES de claves: nunca valores. Basta para diagnosticar.
              echo "  Variables del servicio ($(printf '%s' "$SERV" | jq -r 'length')): $(printf '%s' "$SERV" | jq -r '[.[].envVar.key] | join(", ")')"
            else
              echo "  Encontrada en las variables del servicio."
            fi
          fi

          if [ -z "$TOKEN" ]; then
            echo "  No está en el servicio — se buscan los grupos de entorno vinculados…"
            if GRUPOS=$(api "/services/${RENDER_SERVICE_ID}/env-groups?limit=50"); then
              for GID in $(printf '%s' "$GRUPOS" | jq -r '[.[] | (.envGroup.id // .id)] | .[]' 2>/dev/null); do
                [ -z "$GID" ] && continue
                if DET=$(api "/env-groups/${GID}"); then
                  NOMBRE=$(printf '%s' "$DET" | jq -r '.name // "(sin nombre)"')
                  CLAVES=$(printf '%s' "$DET" | jq -r '[(.envVars // [])[] | .key] | join(", ")')
                  echo "    grupo '${NOMBRE}' → ${CLAVES:-(vacío)}"
                  V=$(printf '%s' "$DET" | jq -r '[(.envVars // [])[] | select(.key == "SMOKE_TEST_TOKEN") | .value][0] // ""')
                  if [ -n "$V" ] && [ "$V" != "null" ]; then
                    TOKEN="$V"; echo "  Encontrada en el grupo de entorno '${NOMBRE}'."; break
                  fi
                fi
              done
            fi
          fi

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::SMOKE_TEST_TOKEN no existe ni en las variables del servicio de Render ni en sus grupos de entorno (ver las claves listadas arriba). Definirla en Render → Environment: es la fuente única de verdad y no hace falta duplicarla en Actions."
            exit 1
          fi

          # Enmascarar ANTES de exportar: sin esto el valor podría aparecer en
          # el log de cualquier paso posterior que lo imprima por accidente.
          echo "::add-mask::$TOKEN"
          echo "SMOKE_TEST_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "Origen del token: entorno de Render (${#TOKEN} caracteres)."

      - name: Ejecutar smoke test contra el backend real
        run: node backend/scripts/smokeTest.js "${{ secrets.SMOKE_TEST_URL }}"

