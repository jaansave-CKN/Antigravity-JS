name: Radar Fondos 360 — CI/CD Pipeline V9.0

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/*'
      - 'client/**'
      - 'backend/**'
      - 'server.js'
      - 'render.yaml'
      - 'package.json'
      - 'vite.config.ts'
      - 'tsconfig.json'

jobs:
  # ── CI: Validación TypeScript + Build (bloqueante) ────────────────────────────
  ci:
    name: CI — TypeScript + Build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Verificar artefactos
        run: |
          echo "✓ Build completado"
          ls -lh dist/
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Fecha: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- Artefactos: $(ls dist/ | wc -l) archivos" >> $GITHUB_STEP_SUMMARY

  # ── CD: Deploy a Render (único destino real — Firebase no existe en esta arquitectura) ──
  deploy:
    name: CD — Deploy a Render
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: FIX TEMPORAL — forzar instalación de devDependencies en Render
        # Causa raíz real (log crudo de Render, deploy dep-d9ohg7qjnfac73auvjs0,
        # commit eca4828): "sh: 1: vite: not found". NODE_ENV=production ya
        # configurado en el servicio hace que "npm install" omita TODAS las
        # devDependencies (vite, typescript, tailwindcss, esbuild...) — el
        # fix de husky (dc6...) resolvió el fallo de husky pero no este, que
        # es el mismo problema de fondo aplicado al resto de devDependencies.
        # NPM_CONFIG_PRODUCTION=false es la env var estándar de npm/Render
        # para forzar la instalación de devDependencies aunque NODE_ENV sea
        # production. No es un secreto, PUT de una sola key, no destructivo.
        env:
          RKEY: ${{ secrets.RENDER_API_KEY }}
          RSVC: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          node -e "
          const RKEY = process.env.RKEY, RSVC = process.env.RSVC;
          (async () => {
            const r = await fetch('https://api.render.com/v1/services/' + RSVC + '/env-vars/NPM_CONFIG_PRODUCTION', {
              method: 'PUT',
              headers: { Authorization: 'Bearer ' + RKEY, 'Content-Type': 'application/json' },
              body: JSON.stringify({ value: 'false' })
            });
            console.log('HTTP status:', r.status);
            console.log(await r.text());
            if (r.status < 200 || r.status >= 300) process.exit(1);
          })();
          "

      - name: Trigger Render deploy
        # API oficial de Render (autenticada), no un Deploy Hook: el servicio
        # ya tiene autoDeploy=yes en Render (deploya solo con cada push a
        # main, sin esperar al CI) — este paso, gateado por needs:ci, es lo
        # que realmente aporta: bloquear el deploy hasta que build/tsc pasen.
        run: |
          HTTP_CODE=$(curl -s -o /tmp/render_response.json -w "%{http_code}" -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json")
          echo "HTTP status: $HTTP_CODE"
          echo "Respuesta de Render:"
          cat /tmp/render_response.json
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Render API respondió HTTP $HTTP_CODE — revisa RENDER_SERVICE_ID/RENDER_API_KEY en Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Render deploy triggered: $(date)"
          echo "## Deploy V9.0" >> $GITHUB_STEP_SUMMARY
          echo "- Render: deploy disparado (HTTP $HTTP_CODE)" >> $GITHUB_STEP_SUMMARY
          echo "- Fecha: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- Fecha: $(date)" >> $GITHUB_STEP_SUMMARY

  # ── Post-Deploy: Smoke Test contra el backend real ya desplegado (bloqueante) ──
  smoke-test:
    name: Smoke Test — post-deploy
    needs: deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Esperar a que el deploy de Render esté activo
        run: sleep 45

      - name: Ejecutar smoke test contra el backend real
        run: node backend/scripts/smokeTest.js "${{ secrets.SMOKE_TEST_URL }}"

  # ── S3 Backup diario (03:00 UTC) — solo en corridas programadas ───────────────
  backup-s3:
    name: S3 Backup diario
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar backup S3
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET:         ${{ secrets.AWS_S3_BUCKET }}
          AWS_REGION:            ${{ secrets.AWS_REGION || 'us-east-1' }}
          DATABASE_URL:          ${{ secrets.DATABASE_URL }}
        run: node -e "import('./backend/scripts/s3backup.js').then(m => m.runS3Backup()).then(r => console.log(JSON.stringify(r))).catch(e => { console.error(e); process.exit(1); })"

      - name: Resumen backup
        if: always()
        run: |
          echo "## Backup S3 V9.0" >> $GITHUB_STEP_SUMMARY
          echo "- Fecha: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- Estado: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
