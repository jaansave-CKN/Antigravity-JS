name: Radar Fondos 360 — CI/CD Pipeline V9.0

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/*'
      - 'client/**'
      - 'backend/**'
      - 'server.js'
      - 'render.yaml'
      - 'package.json'
      - 'vite.config.ts'
      - 'tsconfig.json'

jobs:
  # ── CI: Validación TypeScript + Build (bloqueante) ────────────────────────────
  ci:
    name: CI — TypeScript + Build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Verificar artefactos
        run: |
          echo "✓ Build completado"
          ls -lh dist/
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Fecha: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- Artefactos: $(ls dist/ | wc -l) archivos" >> $GITHUB_STEP_SUMMARY

  # ── CD: Deploy a Render (único destino real — Firebase no existe en esta arquitectura) ──
  deploy:
    name: CD — Deploy a Render
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Trigger Render deploy
        # API oficial de Render (autenticada), no un Deploy Hook. El servicio
        # debe tener autoDeploy=no (render.yaml) para que este paso, gateado
        # por needs:ci, sea el ÚNICO disparador: nada llega a producción sin
        # que tsc/build pasen.
        run: |
          HTTP_CODE=$(curl -s -o /tmp/render_response.json -w "%{http_code}" -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json")
          echo "HTTP status: $HTTP_CODE"
          echo "Respuesta de Render:"
          cat /tmp/render_response.json
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Render API respondió HTTP $HTTP_CODE — revisa RENDER_SERVICE_ID/RENDER_API_KEY en Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Render deploy triggered: $(date)"
          echo "DEPLOY_ID=$(jq -r '.id // empty' /tmp/render_response.json)" >> "$GITHUB_ENV"
          echo "## Deploy V9.0" >> $GITHUB_STEP_SUMMARY
          echo "- Render: deploy disparado (HTTP $HTTP_CODE)" >> $GITHUB_STEP_SUMMARY
          echo "- Fecha: $(date)" >> $GITHUB_STEP_SUMMARY

      - name: Esperar a que ESE deploy quede live y verificar su commit
        # Antes el smoke test arrancaba apenas se DISPARABA el deploy: Render
        # tarda minutos en construir y mientras tanto sigue sirviendo la
        # versión anterior, así que se probaba código viejo. Además, entre el
        # 2026-08-16 y el 2026-09-23 el servicio construía otra rama
        # (radfor360-production, snapshot de la app padre): el CI "desplegaba"
        # con HTTP 2xx pero producción nunca recibió main. Este paso espera el
        # estado final del deploy y exige que el commit desplegado sea el del push.
        run: |
          if [ -z "$DEPLOY_ID" ]; then echo "::error::Render no devolvió id de deploy"; exit 1; fi
          for i in $(seq 1 90); do
            curl -s "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" -H "Accept: application/json" > /tmp/deploy.json
            STATUS=$(jq -r '.status' /tmp/deploy.json)
            echo "Intento $i: $STATUS"
            case "$STATUS" in
              live) break ;;
              build_failed|update_failed|canceled|deactivated|pre_deploy_failed)
                echo "::error::El deploy $DEPLOY_ID terminó en estado $STATUS (ver logs en el Dashboard de Render)"; exit 1 ;;
            esac
            sleep 10
          done
          if [ "$STATUS" != "live" ]; then echo "::error::El deploy $DEPLOY_ID no quedó live en 15 minutos (último estado: $STATUS)"; exit 1; fi
          DEPLOYED_SHA=$(jq -r '.commit.id' /tmp/deploy.json)
          echo "Commit desplegado: $DEPLOYED_SHA | commit del push: $GITHUB_SHA"
          if [ "$DEPLOYED_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Render desplegó $DEPLOYED_SHA, no $GITHUB_SHA — el servicio está construyendo otra rama. Debe ser 'main' (ver docs/DESPLIEGUE_RENDER.md)."
            exit 1
          fi
          echo "- Render: deploy $DEPLOY_ID live con commit $DEPLOYED_SHA" >> $GITHUB_STEP_SUMMARY

  # ── Post-Deploy: Smoke Test contra el backend real ya desplegado (bloqueante) ──
  smoke-test:
    name: Smoke Test — post-deploy
    needs: deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Esperar a que el deploy de Render esté activo
        # Poll real en vez de sleep fijo: el arranque en frío corre seedPredios/
        # seedDirectorio vía REST de Supabase (Capa 2) ANTES de app.listen(),
        # más lento que un sleep 45 fijo — confirmado con evidencia real: los
        # primeros 3 checks del smoke test agotaban el timeout de 15s cada uno
        # (server aún no aceptaba conexiones) mientras los checks 4-6, ya con
        # el server arriba, respondían en <1s.
        run: |
          for i in $(seq 1 24); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "${{ secrets.SMOKE_TEST_URL }}/api/health" || echo "000")
            echo "Intento $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then echo "Servidor activo."; exit 0; fi
            sleep 5
          done
          echo "::warning::/api/health no respondió 200 tras 120s de polling — se ejecuta el smoke test de todas formas."

      - name: Ejecutar smoke test contra el backend real
        run: node backend/scripts/smokeTest.js "${{ secrets.SMOKE_TEST_URL }}"

  # ── S3 Backup diario (03:00 UTC) — solo en corridas programadas ───────────────
  backup-s3:
    name: S3 Backup diario
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar backup S3
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET:         ${{ secrets.AWS_S3_BUCKET }}
          AWS_REGION:            ${{ secrets.AWS_REGION || 'us-east-1' }}
          DATABASE_URL:          ${{ secrets.DATABASE_URL }}
        run: node -e "import('./backend/scripts/s3backup.js').then(m => m.runS3Backup()).then(r => console.log(JSON.stringify(r))).catch(e => { console.error(e); process.exit(1); })"

      - name: Resumen backup
        if: always()
        run: |
          echo "## Backup S3 V9.0" >> $GITHUB_STEP_SUMMARY
          echo "- Fecha: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- Estado: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
