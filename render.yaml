services:
  - type: web
    name: radarfondos-360
    runtime: node
    plan: starter                          # $7/mes — necesario para disco persistente (SQLite fallback)
    buildCommand: npm install && npm run build
    startCommand: node server.js
    healthCheckPath: /api/health
    # false a propósito (2026-09-05): con true, Render desplegaba en cuanto
    # detectaba el push, sin esperar a que el job `ci` de radar.yml corriera
    # tsc/build — el gate `needs: ci` del job `deploy` era cosmético, el
    # código roto ya estaba en producción antes de que CI terminara de fallar.
    # Ahora el único disparador de deploy es la llamada a la API de Render en
    # radar.yml, que sí espera a que tsc/build pasen.
    autoDeploy: false
    disk:
      name: radar-sqlite
      mountPath: /app/backend             # radar.db persiste aquí si no hay DATABASE_URL
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production

      # ── JWT — OBLIGATORIO ───────────────────────────────────────────────────
      # Opción A: dejar generateValue:true (Render genera uno seguro automáticamente)
      # Opción B: pegar manualmente el valor de tu .env si quieres reusar el mismo
      - key: JWT_SECRET
        generateValue: true

      # ── Base de datos — OBLIGATORIO para producción real ────────────────────
      # Pegar la URL de Neon.tech (postgresql://user:pass@host/dbname?sslmode=require)
      # Si se deja vacío, el servidor usa SQLite local (solo para pruebas)
      - key: DATABASE_URL
        sync: false

      # Pool RLS-escopado dedicado (005_INGENIERO_BACKEND, 2026-09-04).
      # Correr backend/migrations/053_rls_scoped_role.sql primero (crea el rol
      # rf360_rls_scoped, sin BYPASSRLS). Sin esto, withTenant() degrada al
      # pool principal (DATABASE_URL) con advertencia en logs — no bloquea el
      # deploy, pero pierde enforcement real de RLS en esa ruta.
      - key: DATABASE_URL_TENANT_SCOPED
        sync: false

      # ── Cifrado de API keys de usuarios ─────────────────────────────────────
      # Si no se define, se usa JWT_SECRET como fallback (funcional pero menos seguro)
      - key: ENCRYPTION_KEY
        generateValue: true

      # ── URLs ─────────────────────────────────────────────────────────────────
      # URL pública del frontend en Firebase (sin trailing slash)
      # Ej: https://antigravity-jairo-2026.web.app
      - key: FRONTEND_URL
        sync: false

      # ── Email transaccional (Brevo) ──────────────────────────────────────────
      # Obtener en: brevo.com → SMTP & API → API Keys
      # Sin esto el reset de contraseña no envía emails (responde 200 silencioso)
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: RadarFondos 360

      # ── Google Gemini API (IA — opcional) ────────────────────────────────────
      # Desbloquea: árbol de objetivos IA + match scoring semántico
      # Obtener en: aistudio.google.com → Get API key
      - key: GOOGLE_API_KEY
        sync: false

      # ── Google OAuth2 (login social — opcional) ──────────────────────────────
      # Crear en: console.cloud.google.com → APIs & Services → Credentials
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false

      # ── Supabase (modo Supabase Auth — opcional, ver bloque en .env.example) ─
      # SUPABASE_SERVICE_KEY es de MAXIMO PRIVILEGIO (bypassa RLS). El backend
      # la usa activamente hoy (backend/config/supabase.config.js, database.config.js,
      # server.js) — auditoria 2026-09-04.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_STORAGE_KEY
        sync: false

      # ── Pagos — Stripe y/o Wompi (backend/payments/*) ────────────────────────
      # PAYMENT_PROVIDER selecciona el proveedor activo; default 'stripe' si se omite.
      - key: PAYMENT_PROVIDER
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_RADAR
        sync: false
      - key: STRIPE_PRICE_FORMULADOR
        sync: false
      - key: STRIPE_PRICE_SUITE
        sync: false
      - key: WOMPI_PUBLIC_KEY
        sync: false
      - key: WOMPI_PRIVATE_KEY
        sync: false
      - key: WOMPI_EVENTS_SECRET
        sync: false
      - key: WOMPI_INTEGRITY_SECRET
        sync: false

      # ── Observabilidad (Sentry backend + PostHog) — opcional, standby si falta ──
      - key: SENTRY_DSN
        sync: false
      - key: VITE_POSTHOG_KEY
        sync: false

      # ── Email transaccional (Resend, alternativa a Brevo) — opcional ─────────
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_NOTIFY_EMAIL
        sync: false

      # ── URL pública del backend (usada en emails y en el build de Vite) ──────
      - key: VITE_API_URL
        sync: false
