services:
  - type: web
    name: radar-formulador-360
    runtime: node
    buildCommand: npm install && npm run build && node scripts/db-check.js
    startCommand: node server.js
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

      # ── IA — requeridos ────────────────────────────────────────────────────
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false

      # ── Base de datos Supabase (REST) — requerido para buildCommand y runtime ──
      # La app usa Supabase vía REST/PostgREST (src/modules/formulador/supabaseClient.js),
      # no una conexión pg directa. Estas dos son las que scripts/db-check.js valida.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false

      # ── Seguridad ──────────────────────────────────────────────────────────
      - key: JWT_SECRET
        sync: false
      # CORS — dominio(s) reales del frontend en producción, separados por coma.
      # Sin esto, server.js cae al default de localhost y bloquea el tráfico real (ver FASE 1, 2026-08-04).
      - key: ALLOWED_ORIGINS
        sync: false

      # ── GitHub (skills/ingenieria/GitHubRouter.js, montado en /api/github) ──
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_OWNER
        sync: false
      - key: GITHUB_REPO
        sync: false

      # ── Caché Redis Upstash (opcional) ─────────────────────────────────────
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

      # ── Firebase Admin (2026-08-12: variables sueltas, no "Secret Files" de Render
      # -- ver src/shared/infrastructure/FirebaseAdmin.js) ────────────────────
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false

      # ── Monitoreo de errores (2026-08-13, opcional -- sin esto el server
      # arranca igual, sin captura de errores. Ver SentryMonitoring.js) ──────
      - key: SENTRY_DSN
        sync: false

      # ── FinOps: costo/tokens por request de IA (2026-09-04, opcional -- sin
      # esto el server arranca igual, sin tracking. Ver LangfuseMonitoring.js) ──
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        sync: false

      # ── Servicios secundarios ──────────────────────────────────────────────
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
